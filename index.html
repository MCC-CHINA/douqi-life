<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>斗气重开模拟器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#0d0a14;color:#e8dcc0;font-family:"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;padding:12px;max-width:640px;margin:0 auto}
h1{font-size:26px;text-align:center;margin:18px 0 4px;color:#f5c542;letter-spacing:4px;text-shadow:0 0 18px rgba(245,197,66,.35)}
.sub{text-align:center;color:#8a7a5c;font-size:13px;margin-bottom:22px}
.screen{display:none}.screen.on{display:block;animation:fade .3s}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
.card{background:#171222;border:1px solid #3a2c17;border-radius:12px;padding:14px;margin-bottom:12px}
.btn{display:block;width:100%;padding:13px;margin:8px 0;background:linear-gradient(180deg,#6b4a12,#4a3208);color:#ffe9b0;border:1px solid #a67c2e;border-radius:10px;font-size:16px;letter-spacing:2px;cursor:pointer}
.btn:active{transform:scale(.98)}
.btn.ghost{background:#221a30;border-color:#4a3a6b}
.btn:disabled{opacity:.4}
.talent-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.talent{border:1px solid #3a2c17;border-radius:10px;padding:10px;background:#171222;cursor:pointer;position:relative}
.talent.sel{border-color:#f5c542;box-shadow:0 0 12px rgba(245,197,66,.35)}
.talent .r{font-size:11px;padding:2px 8px;border-radius:8px;display:inline-block;margin-bottom:6px}
.r0{background:#3a3a3a;color:#bbb}.r1{background:#1d4d2b;color:#9fe6b8}.r2{background:#1d3a6e;color:#a9c8ff}.r3{background:#6e1d1d;color:#ffc9a9}.rk{font-size:11px;padding:1px 7px;border-radius:8px;margin-left:4px;white-space:nowrap}.rk0{background:#3a3a3a;color:#bbb}.rk1{background:#1d4d2b;color:#9fe6b8}.rk2{background:#1d3a6e;color:#a9c8ff}.rk3{background:#3a1d6e;color:#cfa9ff}.rk4{background:#6e4a1d;color:#ffd9a9}.rk5{background:#6e1d1d;color:#ffc9a9}
.talent .nm{font-weight:bold;font-size:15px;margin-bottom:4px}
.talent .ds{font-size:12px;color:#a8977a;line-height:1.5}
.stat-row{display:flex;justify-content:space-between;font-size:14px;padding:6px 2px;border-bottom:1px dashed #2c2317}
.stat-row b{color:#f5c542}
.realm{font-size:20px;color:#f5c542;text-align:center;margin:8px 0;font-weight:bold}
.age{font-size:13px;color:#8a7a5c;text-align:center;margin-bottom:8px}
.evt-title{font-size:17px;color:#ffd97a;margin-bottom:8px;font-weight:bold}
.evt-desc{font-size:14.5px;line-height:1.75;color:#d8c9a8;margin-bottom:12px;white-space:pre-wrap}
.log{font-size:12.5px;color:#7a6c52;max-height:150px;overflow-y:auto;line-height:1.7;border-top:1px solid #2c2317;margin-top:10px;padding-top:8px}
.log div{margin-bottom:2px}
.bar{height:8px;background:#241c10;border-radius:4px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#a67c2e,#f5c542)}
.rank{font-size:42px;text-align:center;margin:10px 0}
.center{text-align:center}.tip{font-size:12px;color:#8a7a5c;text-align:center;margin:8px 0}
.flame{color:#ff9a3c;font-weight:bold}
select,input{width:100%;padding:10px;margin:6px 0;background:#221a30;color:#e8dcc0;border:1px solid #4a3a6b;border-radius:8px;font-size:15px}
</style>
</head>
<body>
<h1>斗气重开模拟器</h1>
<div class="sub">开局抽天赋 · 一切皆随机 · 一世斗气人生</div>

<!-- 开局 -->
<div class="screen on" id="s-start">
  <div class="card">
    <div class="evt-desc">斗气大陆，强者为尊。有人生来便是斗帝血脉，有人终其一生困于斗之气。
    <br><br>抽取你的天赋，随机你的人生。是成为俯瞰众生的斗帝，还是泯然众人的一捧黄土——全看天意。</div>
    <label style="font-size:14px;color:#a8977a">给自己起个名字</label>
    <input id="ipt-name" maxlength="8" placeholder="随机" value="">
    <button class="btn" onclick="newLife()">开始新的人生</button>
  </div>
  <div class="tip">单机小游戏 · 进度保存在本机</div>
</div>

<!-- 选家族 -->
<div class="screen" id="s-clan">
  <div class="card">
    <div class="center" style="font-size:16px;margin-bottom:4px">选择出身家族</div>
    <div class="tip">家族主修方向不同，伴随一生（慎选）</div>
    <div class="talent-grid" id="c-grid"></div>
    <button class="btn" id="c-ok" onclick="confirmClan()" disabled>下一步</button>
  </div>
</div>

<!-- 选天赋 -->
<div class="screen" id="s-talent">
  <div class="card">
    <div class="center" style="font-size:16px;margin-bottom:4px">天道赐福 · 十选其三 <b id="t-pick" style="color:#f5c542">0/3</b></div>
    <div class="tip">点击卡片选择，再点取消</div>
    <div class="talent-grid" id="t-grid"></div>
    <button class="btn" id="t-ok" onclick="confirmTalents()" disabled>投胎！</button>
  </div>
</div>

<!-- 主游戏 -->
<div class="screen" id="s-main">
  <div class="card">
    <div class="realm" id="m-realm">斗之气一段</div>
    <div class="age" id="m-age">0 岁</div>
    <div class="bar"><i id="m-expbar" style="width:0%"></i></div>
    <div id="m-stats"></div>
  </div>
  <div class="card">
    <div class="evt-title" id="e-title">出生</div>
    <div class="evt-desc" id="e-desc"></div>
    <div id="e-choices"></div>
  </div>
  <div class="card">
    <div style="font-size:13px;color:#8a7a5c;margin-bottom:6px">人生轨迹</div>
    <div class="log" id="m-log"></div>
  </div>
</div>

<!-- 结算 -->
<div class="screen" id="s-end">
  <div class="card center">
    <div class="rank" id="e-rank">⚰️</div>
    <div class="evt-title" id="e-etitle" style="text-align:center"></div>
    <div class="evt-desc" id="e-edesc" style="text-align:center"></div>
    <div id="e-eval" style="text-align:left"></div>
    <button class="btn" onclick="newLife()">再活一世</button>
    <button class="btn ghost" onclick="show('s-start')">回到 title</button>
  </div>
</div>

<script>
"use strict";
/* ============ 基础 ============ */
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const RNAME=["凡","良","稀有","传说"];
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));document.getElementById(id).classList.add('on');window.scrollTo(0,0);}

/* ============ 境界 ============ */
const REALMS=[
 {n:"斗之气",s:9},{n:"斗者",s:9},{n:"斗师",s:9},{n:"大斗师",s:9},
 {n:"斗灵",s:9},{n:"斗王",s:9},{n:"斗皇",s:9},{n:"斗宗",s:9},
 {n:"斗尊",s:9},{n:"斗圣",s:9},{n:"斗帝",s:1}
];
const BIGBONUS=[0,0,0,0,0,30,60,120,250,500,1000]; // 大境界寿元加成
function realmName(r,sg){return REALMS[r].n+(REALMS[r].s>1?["","一","二","三","四","五","六","七","八","九"][sg]:"");}
function realmPower(r,sg){ // 战力估算
 let p=0;for(let i=0;i<r;i++)p+=Math.pow(3.2,i)*9;
 return p+Math.pow(3.2,r)*sg;
}

/* ============ 天赋 ============ */
// mod: qh斗气亲和 wx悟性 gg根骨 qy气运 jj家境, cult修炼倍率, flag特殊标记

 {id:"xunbao",n:"寻宝鼠",r:2,d:"天生对宝物敏感。秘境与奇遇收益+50%。",m:{},f:"treasure"},

 {id:"yushou",n:"御兽师",r:2,d:"天生亲近兽类。收服魔兽概率大增，有灵宠相伴战力提升。",m:{},f:"beast"},

 {id:"duxin",n:"读心术",r:2,d:"能看穿人心。负面事件概率降低。",m:{qy:1},f:"mindread"},

 {id:"moxin",n:"魔心",r:2,d:"心向魔道。修炼速度+40%，但心魔丛生。",m:{cult:1.4},f:"demon"},
 {id:"foxin",n:"佛心",r:2,d:"心如止水。受伤与走火入魔概率大幅降低。",m:{},f:"buddha"},
 {id:"guomu",n:"过目不忘",r:1,d:"悟性+2。",m:{wx:2}},
 {id:"shangjia",n:"商贾世家",r:1,d:"开局金钱+1000。",m:{}},
 {id:"liehu",n:"猎户出身",r:1,d:"战斗胜率+10%。",m:{},f:"hunter"},
 {id:"tiejiang",n:"铁匠",r:1,d:"自打造兵器。战斗胜率+8%。",m:{},f:"smith"},
 {id:"qingnang",n:"杏林世家",r:1,d:"懂医术。受伤概率-15%。",m:{},f:"doctor"},

 {id:"tanchi",n:"贪吃",r:0,d:"管不住嘴。每年消耗50金买吃的（没钱则饿肚子修炼-5%)。",m:{},f:"foodie"},
 {id:"hualao",n:"话痨",r:0,d:"人缘极好但静不下心。社交事件概率+，修炼速度-5%。",m:{cult:0.95},f:"talk"},
];
function drawTalents(){
 const unlocked=getUnlocked();
 const pool=[...TALENTS.filter(t=>t.r<3||unlocked.includes(t.id))],out=[];
 // 已解锁的传说必出一张
 const myLegends=pool.filter(t=>t.r===3);
 if(myLegends.length){const g=pick(myLegends);out.push(g);pool.splice(pool.indexOf(g),1);}
 const weights={0:50,1:30,2:15,3:5};
 while(out.length<10&&pool.length){
   let tw=pool.reduce((s,t)=>s+weights[t.r],0),x=Math.random()*tw,sel=pool[0];
   for(const t of pool){x-=weights[t.r];if(x<=0){sel=t;break;}}
   out.push(sel);pool.splice(pool.indexOf(sel),1);
 }
 return out;
}
/* ============ 随机事件 ============ */
const FLAMES=[
 {n:"紫极天火",r:2,m:{cult:1.2},d:"修炼速度+20%"},
 {n:"寒月冰焰",r:2,m:{fight:0.15},d:"战斗胜率+15%"},
 {n:"大日金乌炎",r:3,m:{cult:1.3},d:"修炼速度+30%"},
 {n:"九幽冥火",r:3,m:{fight:0.25},d:"战斗胜率+25%"},
 {n:"虚空雷炎",r:4,m:{brk:0.08},d:"突破概率+8%"},
 {n:"青木灵火",r:1,m:{med:1.5},d:"丹药效果+50%"},
 {n:"血河魔焰",r:5,m:{fight:0.3},d:"战斗胜率+30%"},
 {n:"星辰古焱",r:1,m:{qy:2},d:"气运+2"},
 {n:"南明离火",r:2,m:{cult:1.15,fight:0.1},d:"修炼+15%，战斗+10%"},
 {n:"太阴真火",r:3,m:{cult:1.25},d:"修炼速度+25%"},
 {n:"九天玄火",r:4,m:{fight:0.2,brk:0.05},d:"战斗+20%，突破+5%"},
 {n:"红莲业火",r:5,m:{fight:0.35},d:"战斗胜率+35%"},
 {n:"幽冥鬼火",r:4,m:{cult:1.2,brk:0.05},d:"修炼+20%，突破+5%"},
 {n:"烈阳真焱",r:5,m:{cult:1.35},d:"修炼速度+35%"}
];
function flameOf(n){return FLAMES.find(f=>f.n===n);}
function flameBonus(s,key){
 let b=(key==="cult"||key==="med")?1:0;
 s.flames.forEach(n=>{const f=flameOf(n);if(f&&f.m[key]){b=(key==="cult"||key==="med")?b*f.m[key]:b+f.m[key];}});
 return b;
}
function flameBonusRefined(s,key){
 let b=flameBonus(s,key);
 if(s.flags.refine){b=(key==="cult"||key==="med")?b*1.25:b+0.1;}
 return b;
}
function obtainFlame(s){
 const avail=FLAMES.filter(f=>!s.flames.includes(f.n));
 if(!avail.length)return null;
 const f=pick(avail);s.flames.push(f.n);
 if(f.m.qy)s.stats.qy+=f.m.qy;
 addLog("收服异火："+RANKS[f.r]+f.n+"（"+f.d+"）");unlock(s,"fire");checkAch(s);
 return f;
}
function hasT(s,id){return s.talents.includes(id);}
function lucky(s){return Math.random()<(0.12+s.stats.qy*0.015)*(hasT(s,"tianming")?2:1);}

const EVENTS=[
{t:"山洞奇遇",cond:s=>s.age>=8&&!s.flags.cave,d:"你在后山玩耍时，跌入一个隐蔽的山洞。洞壁上刻满了晦涩的功法口诀，角落里还有一具枯骨，怀中抱着一个木盒。",
 c:[{t:"参悟壁刻",f:s=>{const g=R(50,200)*(hasT(s,"xunbao")?1.5:1);s.exp+=g;return "你盘坐三日，略有所悟，修为+"+Math.round(g)+"。";}},
     {t:"打开木盒",f:s=>{if(lucky(s)){s.money+=R(500,2000);s.exp+=150;return "木盒中竟有前人遗留的丹药与金票！修为+150，金钱大增。";}s.exp+=30;return "木盒里只有几本杂记，你读完略有感悟，修为+30。";}},
     {t:"原路返回",f:s=>{return "你觉得此地阴森，还是先回去吧。";}}]},
{t:"神秘残魂",cond:s=>s.age>=10&&!s.flags.soul,d:"你在坊市地摊上买到一枚古朴的黑色戒指。深夜，戒指中飘出一道苍老残魂，自称生前是大陆顶尖强者，愿收你为徒。",
 c:[{t:"拜师",f:s=>{s.flags.soul=true;s.flags.master=true;s.stats.wx+=2;return "残魂大笑三声，传你一门高深功法。悟性+2，修炼速度提升，此后每年额外获得修为。";}},

const GONGFA=[
 {n:"纳气诀",t:0,m:1.1},{n:"青木功",t:0,m:1.15},{n:"混元桩",t:0,m:1.12},
 {n:"焚天诀",t:1,m:1.3},{n:"九转轮回诀",t:1,m:1.35},{n:"寒玉功",t:1,m:1.28},{n:"金刚不坏功",t:1,m:1.32},

];
function gainGongfa(s,tier){
 const cands=GONGFA.filter(g=>g.t===tier);if(!cands.length)return null;
 const g=pick(cands);
 if(s.gongfas.some(x=>x.n===g.n))return {g:g,dup:true};
 if(s.gongfas.length<3){
  s.gongfas.push(g);sortGongfas(s);
  addLog("习得"+RANKS[g.t]+"功法《"+g.n+"》");unlock(s,"gongfa");
  return {g:g,learned:true};
 }
 // 已满3门，需要玩家选择是否替换
 s.pendingGongfa=g;
 return {g:g,needChoice:true};
}
function sortGongfas(s){s.gongfas.sort((a,b)=>b.m-a.m);}
function gongfaMult(s){
 if(!s.gongfas||!s.gongfas.length)return 1;
 return s.gongfas[0].m*(1+0.05*(s.gongfas.length-1));
}
function showGongfaReplace(){

 h+="当前功法：<br>"+S.gongfas.map((x,i)=>(i===0?"【主修】":"【辅修】")+"《"+x.n+"》"+RANKS[x.t]+"（×"+x.m+"）").join("<br>");

  b.onclick=()=>{S.gongfas[i]=g;sortGongfas(S);addLog("以《"+g.n+"》替换了《"+x.n+"》");unlock(S,"gongfa");renderStats();nextYearCard("功法已替换为《"+g.n+"》。");};
  box.appendChild(b);

 T.forEach(t=>{const m=t.m||{};for(const k in m){if(k==='cult')continue;st[k]=clamp((st[k]||0)+m[k],1,15);}});
 S={name:nm,age:0,r:0,sg:1,exp:0,need:calcNeed(0,1),stats:st,
    talents:T.map(t=>t.id),talentObjs:T,flags:{},flames:[],money:st.jj*120,gongfas:[],weapon:null,ach:{},clan:null,clanId:null,
    spouse:null,sect:null,lifespan:60+st.gg*3,alive:true,timeline:[],maxR:0,maxSg:1,kills:0,forceEvent:null,trib:0};
 S.lifespan-=T.some(t=>t.id==="tiruo")?15:0;

 applyClan(S);
 if(T.some(t=>t.id==="shangjia"))S.money+=1000;
 const carry=getCarry();
 if(carry){const ct=TALENTS.find(t=>t.id===carry);
  if(ct&&!S.talents.includes(carry)){S.talents.push(carry);S.talentObjs.push(ct);addLog("转世携带天赋："+ct.n);}
  clearCarry();}
 show('s-main');renderStats();
 const home=S.stats.jj>=10?"名门望族":S.stats.jj>=7?"小康之家":S.stats.jj>=4?"平民百姓":"贫苦人家";
 showCard("出生","斗气大陆，加玛帝国偏远小城。<br><br>你出生在"+home+"，取名<b>"+nm+"</b>。"+(T.some(t=>t.id==="doudi")?"<br>出生那日，天现异象，族中长老断言你血脉不凡！":""),

function calcNeed(r,sg){return Math.round(60*Math.pow(1.35,r)*(1+sg*0.25));}
function cultRate(s){
 let c=1;s.talentObjs.forEach(t=>{if(t.m&&t.m.cult)c*=t.m.cult;});
 if(hasT(s,"lunhui"))c*=s.age<30?0.7:2;
 if(s.flags.master)c*=1.3;
 c*=gongfaMult(s);
 c*=flameBonusRefined(s,"cult");
 if(s.flags.doudi_chuancheng)c*=1.5;
 if(s.sect)c*=1.2;
 return c;
}
function realmNameFull(s){return realmName(s.r,s.sg);}

function startYear(){
 if(!S.alive)return;
 S.age++;
 if(S.age>=S.lifespan){die(S,"寿元耗尽，安然离世，享年"+S.age+"岁。");showEnding();return;}
 // 修炼
 if(hasT(S,"foodie")){if(S.money>=50)S.money-=50;}
 if(hasT(S,"drunk")&&Math.random()<0.08&&S.money>=100){const l=Math.min(S.money,R(50,200));S.money-=l;addLog("酒后闹事，赔了"+l+"金");}
 const g=Math.round((30+S.stats.qh*10+S.r*40)*cultRate(S)*(0.8+Math.random()*0.5));
 S.exp+=g;
 checkAch(S);
 let grew=tryBreakthrough();
 if(S.sect){S.money+=200;S.exp+=Math.round(30*cultRate(S));}
 if(S.flags.master)S.exp+=Math.round(40*cultRate(S));
 renderStats();
 // 强制天劫
 if((S.r===7&&S.sg===9)||(S.r===9&&S.sg===9)){
   const ev=EVENTS.find(e=>e.t==="天劫");showEvent(ev);return;
 }
 // 随机事件
 const elig=EVENTS.filter(e=>e.t!=="天劫"&&e.t!=="大限"&&(!e.cond||e.cond(S)));
 if(elig.length&&Math.random()<0.8){showEvent(pick(elig));}
 else{showCard("平静的一年",S.age+"岁，你潜心修炼，修为+"+g+"。"+(grew?"<br><b>并成功突破！</b>":""),
   [{t:"下一年",f:()=>""}]);}
}
function tryBreakthrough(){
 let grew=false;
 while(S.exp>=S.need&&S.r<10){
   if((S.r===7&&S.sg===9)||(S.r===9&&S.sg===9))break; // 等天劫事件
   const big=S.sg>=REALMS[S.r].s;
   const ch=big?0.45+S.stats.wx*0.02+S.stats.qy*0.01:0.75+S.stats.wx*0.02+(hasT(S,"wuchi")?0.05:0);
   if(Math.random()<Math.min(ch+flameBonusRefined(S,"brk"),0.98)){
     S.exp-=S.need;advanceRealm();grew=true;
   }else{
     S.exp=Math.floor(S.need*0.5);
     if(big&&Math.random()<0.3)injure(S,0.25);
     addLog("突破"+realmName(S.r,S.sg+ (big?1:S.sg))+"失败");
     break;
   }
 }
 return grew;
}
function advanceRealm(){
 if(S.sg>=REALMS[S.r].s){S.r++;S.sg=1;S.lifespan+=BIGBONUS[S.r]||0;
   addLog("突破至<b>"+realmNameFull(S)+"</b>！寿元大增");
   if(hasT(S,"jiuzhuan")){S.stats.qh++;S.stats.wx++;S.stats.gg++;S.stats.qy++;addLog("九转金身：全属性+1");}
   if(S.r===1)unlock(S,"douzhe");if(S.r===5)unlock(S,"douwang");
   if(S.r===6)unlock(S,"douhuang");if(S.r===10)unlock(S,"doudi");}
 else{S.sg++;addLog("突破至"+realmNameFull(S));}
 if(S.r>S.maxR||(S.r===S.maxR&&S.sg>S.maxSg)){S.maxR=S.r;S.maxSg=S.sg;}
 S.need=calcNeed(S.r,S.sg);
}
function fightWin(s,base){
 let ch=base;
 if(hasT(s,"shafa"))ch+=0.3;if(hasT(s,"wuchi"))ch+=0.15;if(hasT(s,"shenli"))ch+=0.15;
 if(hasT(s,"chongdong"))ch+=0.1;
 if(hasT(s,"swordmaster"))ch+=0.4;if(hasT(s,"hunter"))ch+=0.1;if(hasT(s,"smith"))ch+=0.08;
 if(hasT(s,"drunk"))ch+=0.2;if(hasT(s,"beast")&&s.flags.pet)ch+=0.15;
 if(s.flags.bro)ch+=0.1;
 ch+=flameBonusRefined(s,"fight");
 if(s.weapon)ch+=s.weapon.f;
 if(s.clanId==="tianjian")ch+=0.15;
 ch+=s.stats.qy*0.01;
 const win=Math.random()<clamp(ch,0.05,0.95);
 if(win)s.kills++;
 return win;
}
function injure(s,sev){
 if(hasT(s,"foxin"))sev*=0.6;if(hasT(s,"qingnang"))sev*=0.85;if(hasT(s,"zhenfa"))sev*=0.9;
 s.exp=Math.floor(s.exp*(1-sev*0.4));
 if(Math.random()<sev*0.12&&!hasT(s,"tongpi")){die(s,"重伤不治，撒手人寰，享年"+s.age+"岁。");return true;}
 addLog("身受重伤");
 return false;
}
function die(s,cause){
 if(s.flags.revive&&!cause.includes("寿元")){s.flags.revive=false;addLog("九转还魂丹救了你一命！");unlock(s,"revive");return false;}
 s.alive=false;s.cause=cause;return true;
}

/* ============ 界面 ============ */
function renderStats(){
 document.getElementById('m-realm').textContent=realmNameFull(S);
 document.getElementById('m-age').textContent=S.age+" 岁 / 寿元 "+S.lifespan;
 document.getElementById('m-expbar').style.width=Math.min(100,S.exp/S.need*100)+"%";
 const st=S.stats;
 let h=`<div class="stat-row"><span>斗气亲和</span><b>${st.qh}</b></div>
 <div class="stat-row"><span>悟性</span><b>${st.wx}</b></div>
 <div class="stat-row"><span>根骨</span><b>${st.gg}</b></div>
 <div class="stat-row"><span>气运</span><b>${st.qy}</b></div>
 <div class="stat-row"><span>家境</span><b>${st.jj}</b></div>
 <div class="stat-row"><span>金钱</span><b>${S.money}</b></div>`;
 if(S.sect)h+=`<div class="stat-row"><span>宗门</span><b>${S.sect}</b></div>`;
 if(S.spouse)h+=`<div class="stat-row"><span>道侣</span><b>${S.spouse}</b></div>`;
 if(S.flames.length)h+=`<div class="stat-row"><span>异火</span><b class="flame">${S.flames.map(n=>{const f=flameOf(n);return f?f.n+RANKS[f.r]||f.n:n;}).join("、")}</b></div>`;
 if(S.clan)h+=`<div class="stat-row"><span>家族</span><b>${S.clan}·${S.clanF}</b></div>`;
 if(S.gongfas&&S.gongfas.length)h+=`<div class="stat-row"><span>功法(${S.gongfas.length}/3)</span><b style="font-size:12px">${S.gongfas.map((x,i)=>(i===0?"【主】":"")+ "《"+x.n+"》"+RANKS[x.t]).join("、")}</b></div>`;
 if(S.weapon)h+=`<div class="stat-row"><span>武器</span><b>「${S.weapon.n}」${rankTag(S.weapon.t)}</b></div>`;
 h+=`<div class="stat-row"><span>天赋</span><b style="font-size:12px">${S.talentObjs.map(t=>t.n).join("、")}</b></div>`;
 document.getElementById('m-stats').innerHTML=h;
}
function showCard(title,desc,choices){
 document.getElementById('e-title').textContent=title;
 document.getElementById('e-desc').innerHTML=desc;
 const box=document.getElementById('e-choices');box.innerHTML="";
 choices.forEach(c=>{
  const b=document.createElement('button');b.className='btn';b.textContent=c.t;
  if(c.raw){b.onclick=()=>{c.f(S);renderStats();if(!S.alive)showEnding();};}
  else b.onclick=()=>{
   const res=c.f(S)||"";
   if(S.pendingGongfa){renderStats();showGongfaReplace();return;}
   if(S.trib){S.trib=0;S.r++;S.sg=1;S.exp=0;S.need=calcNeed(S.r,S.sg);S.lifespan+=BIGBONUS[S.r]||0;
     if(S.r>S.maxR){S.maxR=S.r;S.maxSg=1;}addLog("渡过天劫，成就<b>"+realmNameFull(S)+"</b>！");}
   renderStats();
   if(!S.alive){showEnding();return;}
   showCard(title,res,[{t:"下一年",f:()=>startYear(),raw:true}]);
  };
  box.appendChild(b);
 });
}
function showEvent(ev){
 const desc=typeof ev.d==="function"?ev.d(S):ev.d;
 showCard(ev.t,desc,ev.c);
}
const RANKT=["⚰️","🌱","🗡️","🛡️","👑","🔥","⛰️","🌩️","🐉","✨","☀️"];
const RANKN=["泯然众人","初入斗气","一方好手","小有名气","斗王强者","斗皇老祖","斗宗传奇","斗尊大能","斗圣传说","半步斗帝","千古斗帝"];
function showEnding(){
 const i=Math.min(S.maxR,10);
 document.getElementById('e-rank').textContent=RANKT[i]||"⚰️";
 document.getElementById('e-etitle').textContent=S.name+" · "+RANKN[i];
 document.getElementById('e-edesc').innerHTML=(S.cause||"离世")+"<br>享年 "+S.age+" 岁";
 const tl=S.timeline.slice(-8).reverse().map(t=>`<div class="stat-row"><span>${t}</span></div>`).join("");
 saveRecords();
 const lqGet=earnLingqi(S);
 const achList=ACHS.filter(a=>S.ach[a.id]);
 const achHtml=achList.length?achList.map(a=>`<span style="display:inline-block;background:#2c2317;border:1px solid #a67c2e;border-radius:8px;padding:4px 10px;margin:3px;font-size:12px;color:#ffd97a">🏆${a.n}</span>`).join(""):"<div class='tip'>本世未获得成就</div>";
 document.getElementById('e-eval').innerHTML=
  `<div class="stat-row"><span>最高境界</span><b>${realmName(S.maxR,S.maxSg)}</b></div>
   <div class="stat-row"><span>收服异火</span><b class="flame">${S.flames.length?S.flames.join("、"):"无"}</b></div>
   <div class="stat-row"><span>功法</span><b style="font-size:12px">${S.gongfas&&S.gongfas.length?S.gongfas.map(x=>"《"+x.n+"》"+RANKS[x.t]).join("、"):"无"}</b></div>
   <div class="stat-row"><span>武器</span><b>${S.weapon?"「"+S.weapon.n+"」"+RANKS[S.weapon.t]:"无"}</b></div>
   <div class="stat-row"><span>斩杀</span><b>${S.kills} 人</b></div>
   <div class="stat-row"><span>金钱</span><b>${S.money}</b></div>
   <div class="stat-row"><span>本世获得灵气</span><b style="color:#a9c8ff">+${lqGet}（余额 ${getLingqi()}）</b></div>
   <div style="margin:10px 0 6px;font-size:13px;color:#8a7a5c">本世成就（${achList.length}/${ACHS.length}）</div>
   <div style="margin-bottom:6px">${achHtml}</div>
   <div style="margin:10px 0 6px;font-size:13px;color:#8a7a5c">转世：选一个天赋带入下一世</div>
   <div id="e-carry" style="margin-bottom:6px"></div>
   <div style="margin-top:10px;font-size:13px;color:#8a7a5c">人生剪影</div>${tl||"<div class='tip'>碌碌无为的一生</div>"}`;
 const cb=document.getElementById('e-carry');cb.innerHTML="";
 S.talentObjs.forEach(t=>{
  const b=document.createElement('button');b.className='btn ghost';b.style.fontSize='13px';b.style.padding='8px';b.textContent=t.n+"（"+RNAME[t.r]+"）";
  b.onclick=()=>{setCarry(t.id);cb.innerHTML="<div class='tip'>已选定："+t.n+"，下一世开局自动携带</div>";};
  cb.appendChild(b);
 });
 show('s-end');
}
function renderLingqiPanel(){
 try{
  const lq=getLingqi(),unlocked=getUnlocked();
  const legends=TALENTS.filter(t=>t.r===3);
  const d=document.createElement('div');d.className='card';d.id='lq-panel';
  let h="<div style='font-size:14px;margin-bottom:8px'>灵气：<b style='color:#a9c8ff'>"+lq+"</b> <span style='font-size:11px;color:#8a7a5c'>（每世结算按境界/成就/寿元发放）</span></div>";
  h+="<div style='font-size:13px;color:#8a7a5c;margin-bottom:6px'>传说天赋解锁</div><div class='talent-grid'>";
  legends.forEach(t=>{
   const un=unlocked.includes(t.id),cost=LQ_COST[t.id]||100;
   h+="<div class='talent"+(un?" sel":"")+"' id='lq-"+t.id+"'>"+
     "<span class='r r3'>传说"+(un?"·已解锁":"")+"</span>"+
     "<div class='nm'>"+t.n+"</div><div class='ds'>"+t.d+"</div>"+
     (un?"":"<div style='margin-top:6px'><button class='btn' style='padding:8px;font-size:13px' data-tid='"+t.id+"' data-cost='"+cost+"' onclick='buyTalent(this.dataset.tid,+this.dataset.cost)'>"+cost+"灵气解锁</button></div>")+
     "</div>";
  });
  h+="</div>";
  d.innerHTML=h;
  const s=document.getElementById('s-start');s.insertBefore(d,s.children[1]);
 }catch(e){}
}
function buyTalent(id,cost){
 if(!spendLingqi(cost)){alert("灵气不足！");return;}
 unlockTalent(id);
 const p=document.getElementById('lq-panel');if(p)p.remove();
 renderLingqiPanel();
}
// 开局界面显示历史战绩
(function(){
 try{
  const r=getRecords();
  if(r.maxR!==undefined){
   const d=document.createElement('div');d.className='card';
   d.innerHTML="<div style='font-size:13px;color:#8a7a5c;margin-bottom:6px'>历史最佳战绩</div>"+
    "<div class='stat-row'><span>最高境界</span><b>"+realmName(r.maxR,r.maxSg||1)+"</b></div>"+
    "<div class='stat-row'><span>最长寿</span><b>"+(r.maxAge||0)+" 岁</b></div>"+
    "<div class='stat-row'><span>最多斩杀</span><b>"+(r.maxKills||0)+" 人</b></div>";
   const s=document.getElementById('s-start');s.insertBefore(d,s.children[1]);
  }
  renderLingqiPanel();
  const carry=getCarry();
  if(carry){const t=TALENTS.find(x=>x.id===carry);
   if(t){const d=document.createElement('div');d.className='tip';d.textContent="转世携带天赋："+t.n+"（下一世开局自动获得）";
    document.getElementById('s-start').appendChild(d);}}
 }catch(e){}
})();
// 随机名
if(!document.getElementById('ipt-name').value)document.getElementById('ipt-name').placeholder="如："+pick(SURN)+pick(GIVN);
</script>
